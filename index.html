/* --- structural styles (ported from the prototype <style>) --- */
.ms-scope * { margin:0;padding:0;box-sizing:border-box }
.ms-scope { background:radial-gradient(140% 100% at 50% 0%,var(--ms-c-eaeff6) 0%,var(--ms-c-d4deea) 58%,var(--ms-c-c6d2e2) 100%);font-family:'Sofia Pro','Sofia Sans',Aptos,system-ui,-apple-system,sans-serif;color:var(--ms-c-152538);display:flex;flex-direction:column;align-items:center;min-height:100%;padding:26px 12px 60px;font-variant-numeric:tabular-nums }
.ms-scope .device, .ms-scope .device * { font-family:'Sofia Pro','Sofia Sans',Aptos,system-ui,-apple-system,sans-serif }
.ms-scope .title { font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ms-c-4d5461);margin-bottom:14px }
.ms-scope .picker { display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:420px;margin-bottom:18px }
.ms-scope .pick { font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:100px;border:1px solid var(--ms-c-cfd6df);background:var(--ms-c-fff);color:var(--ms-c-4d5461);cursor:pointer }
.ms-scope .pick.on { background:var(--ms-c-0e4b78);color:var(--ms-c-fff);border-color:var(--ms-c-0e4b78) }
.ms-scope .device { position:relative;width:402px;max-width:96vw;height:874px;background:var(--ms-c-0b0b0c);border-radius:48px;padding:11px;box-shadow:0 40px 80px -30px var(--ms-a-1) }
.ms-scope .screenwrap { position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--ms-c-fff) }
.ms-scope .notch { position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:30px;background:var(--ms-c-0b0b0c);border-radius:0 0 18px 18px;z-index:50 }
.ms-scope .phone-screen { position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;padding-bottom:64px }
.ms-scope .phone-screen.active { display:block }
.ms-scope .navbar { position:absolute;left:0;right:0;bottom:0;z-index:55;height:64px;display:flex;background:var(--ms-a-2);backdrop-filter:blur(12px);border-top:1px solid var(--ms-c-e9edf2);box-shadow:0 -8px 22px -14px var(--ms-a-3) }
.ms-scope .navitem { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--ms-c-9aa7b6);font-size:9.5px;font-weight:700;cursor:pointer;padding:0 }
.ms-scope .navitem.on { color:var(--ms-c-0e4b78) }
.ms-scope .brand { position:absolute;top:16px;left:16px;z-index:66;width:32px;height:32px;border-radius:9px;background:var(--ms-c-fff);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 9px -1px var(--ms-a-4) }
.ms-scope .brand img { width:21px;height:21px;object-fit:contain }
.ms-scope .backbtn { position:absolute;top:54px;left:18px;z-index:65;display:none;width:30px;height:30px;border:none;background:transparent;color:var(--ms-c-fff);filter:drop-shadow(0 1px 3px var(--ms-a-5));align-items:center;justify-content:center;cursor:pointer;padding:0 }
.ms-scope .device *::-webkit-scrollbar { width:0;height:0;display:none }
.ms-scope .device * { scrollbar-width:none;-ms-overflow-style:none }
.ms-scope .luna { position:absolute;right:16px;bottom:86px;z-index:60;width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(150deg,var(--ms-c-2c6fd6),var(--ms-c-123b66) 70%,var(--ms-c-0e2a4e));display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--ms-a-6),0 10px 22px -8px var(--ms-a-7) }
.ms-scope .lunapop { position:absolute;inset:0;z-index:70;display:none;background:var(--ms-a-8) }
.ms-scope .lunapop.open { display:block }
.ms-scope .lunacard { position:absolute;left:12px;right:12px;top:70px;bottom:12px;border-radius:24px;overflow:hidden;background:radial-gradient(135% 100% at 50% 0%,var(--ms-c-e8eef9),var(--ms-c-c3d0e8));display:flex;flex-direction:column;box-shadow:0 28px 60px -18px var(--ms-a-9) }
.ms-scope .lunahead { background:linear-gradient(155deg,var(--ms-c-17427a),var(--ms-c-0e2a4e) 60%,var(--ms-c-0b2044));padding:16px;display:flex;align-items:center;gap:11px;color:var(--ms-c-fff) }
.ms-scope .lunascroll { flex:1;padding:14px;display:flex;flex-direction:column;gap:10px }
.ms-scope .msg { align-self:flex-start;max-width:82%;background:var(--ms-c-fff);border-radius:16px 16px 16px 5px;padding:10px 13px;font-size:13.5px;line-height:1.5;box-shadow:0 8px 20px -16px var(--ms-a-10) }
.ms-scope .chips { display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto }
.ms-scope .chip { flex:none;font-size:11px;font-weight:600;color:var(--ms-c-1a4b8a);background:var(--ms-a-11);border:1px solid var(--ms-a-12);padding:6px 11px;border-radius:14px;white-space:nowrap;cursor:pointer }
.ms-scope .lunainput { padding:10px 12px 14px;background:var(--ms-c-fff);border-top:1px solid var(--ms-c-e7ecf2);display:flex;gap:9px;align-items:center }
.ms-scope .lunainput input { flex:1;border:1px solid var(--ms-c-e7ecf2);border-radius:22px;padding:12px 16px;font-size:14px;outline:none;background:var(--ms-c-f6f8fb) }
.ms-scope .login { position:absolute;inset:0;z-index:80;background:radial-gradient(130% 100% at 50% 0%,var(--ms-c-17427a),var(--ms-c-0e2a54) 55%,var(--ms-c-081a3a));display:flex;flex-direction:column;color:var(--ms-c-fff);overflow:hidden }
.ms-scope .login.hidden { display:none }
.ms-scope .login-aur { position:absolute;inset:-25%;background:radial-gradient(50% 50% at 25% 20%,var(--ms-a-13),transparent 60%),radial-gradient(50% 50% at 82% 30%,var(--ms-a-14),transparent 60%),radial-gradient(50% 50% at 60% 85%,var(--ms-a-15),transparent 60%);filter:blur(2px) }
.ms-scope .login-body { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 30px;text-align:center;position:relative;z-index:2 }
.ms-scope .logo-tile { width:78px;height:78px;border-radius:20px;background:var(--ms-c-fff);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px -10px var(--ms-a-16) }
.ms-scope .logo-tile img { width:44px;height:44px;object-fit:contain }
.ms-scope .login-title { font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:20px }
.ms-scope .login-sub { font-size:14px;color:var(--ms-a-17);margin-top:8px;line-height:1.5;max-width:280px }
.ms-scope .login-foot { position:relative;z-index:2;padding:0 24px 40px }
.ms-scope .faceid { width:100%;padding:16px;border-radius:16px;background:var(--ms-c-4c8fe8);color:var(--ms-c-fff);font-weight:700;font-size:15px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px }
.ms-scope .passcode { width:100%;padding:14px;margin-top:10px;border-radius:16px;background:var(--ms-a-18);color:var(--ms-c-fff);font-weight:700;font-size:14px;border:none;cursor:pointer }
.ms-scope .login-note { font-size:11px;color:var(--ms-a-19);text-align:center;margin-top:16px }
.ms-scope .spend.hide .amt { filter:blur(7px) }
.ms-scope .device { box-shadow:0 44px 90px -34px var(--ms-a-9),0 0 0 1px var(--ms-a-20) }
.ms-scope .device button, .ms-scope .mchip, .ms-scope .pick { transition:transform .14s cubic-bezier(.34,1.3,.5,1),background .2s ease,box-shadow .2s ease,color .2s ease }
.ms-scope .device button:active { transform:scale(.97) }
.ms-scope .pick { transition:all .18s ease }
.ms-scope .pick:active { transform:scale(.96) }
.ms-scope .pick.on { box-shadow:0 8px 18px -8px var(--ms-a-21) }
.ms-scope .phone-screen.active { animation:scrFade .34s cubic-bezier(.32,.72,.3,1) both }
.ms-scope input[type=range] { accent-color:var(--ms-c-0e4b78) }

/* --- React chrome modifiers (state toggled in TSX; no inline styles) --- */
.ms-scope .login-mark { width:118px; height:118px; object-fit:contain; margin:0 auto 2px; }
.ms-scope .backbtn.show { display:flex }
.ms-scope .luna { color:var(--ms-c-fff) }
.ms-scope .navitem { -webkit-appearance:none; appearance:none }
/* Chrome icon fill/stroke live here so the JSX carries no colour-prop literals. */
.ms-scope .navbar svg, .ms-scope .backbtn svg, .ms-scope .luna svg { fill:none; stroke:currentColor }

.ms-scope .brand { display:none }

/* --- keyframes (global; prototype names preserved) --- */
@keyframes scrFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes auroraDrift{0%{background-position:0% 18%}50%{background-position:100% 72%}100%{background-position:0% 18%}}
